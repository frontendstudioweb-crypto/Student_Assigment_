<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Register | Student Assignment Submission System</title>

    <!-- Bootstrap 5 -->

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">

    <!-- Bootstrap Icons -->

    <link rel="stylesheet"
        href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">

    <!-- Google Font -->

    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap"
        rel="stylesheet">

    <!-- Custom CSS -->

    <link rel="stylesheet" href="registerstyle.css">

</head>

<body class="bg-light">

    <!-- ================= REGISTER SECTION ================= -->

    <section class="py-5 register-page">

        <div class="container">

            <div class="row justify-content-center">

                <div class="col-lg-10">

                    <div class="card shadow-lg border-0 rounded-4">

                        <div class="card-body p-5">

                            <!-- Heading -->

                            <div class="text-center mb-5">

                                <i class="bi bi-person-plus-fill text-primary display-3"></i>

                                <h2 class="fw-bold mt-3">

                                    Student Registration

                                </h2>

                                <p class="text-muted">

                                    Create your account to start submitting assignments.

                                </p>

                            </div>

                            <!-- Registration Form -->

                            <form>

                                <div class="row">

                                    <!-- Full Name -->

                                    <div class="col-md-6 mb-4">

                                        <label class="form-label">Full Name</label>

                                        <input type="text"
                                            class="form-control"
                                            placeholder="Enter Full Name">

                                    </div>

                                    <!-- Roll Number -->

                                    <div class="col-md-6 mb-4">

                                        <label class="form-label">Roll Number</label>

                                        <input type="text"
                                            class="form-control"
                                            placeholder="Enter Roll Number">

                                    </div>

                                    <!-- Registration Number -->

                                    <div class="col-md-6 mb-4">

                                        <label class="form-label">

                                            Registration Number

                                        </label>

                                        <input type="text"
                                            class="form-control"
                                            placeholder="University Registration Number">

                                    </div>

                                    <!-- Department -->

                                    <div class="col-md-6 mb-4">

                                        <label class="form-label">

                                            Department

                                        </label>

                                        <select class="form-select">

                                            <option selected>Select Department</option>

                                            <option>BCA</option>

                                            <option>BBA</option>

                                            <option>B.Com</option>

                                            <option>B.Sc</option>

                                            <option>MCA</option>

                                        </select>

                                    </div>

                                    <!-- Semester -->

                                    <div class="col-md-6 mb-4">

                                        <label class="form-label">

                                            Semester

                                        </label>

                                        <select class="form-select">

                                            <option>Select Semester</option>

                                            <option>Semester 1</option>
                                            <option>Semester 2</option>
                                            <option>Semester 3</option>
                                            <option>Semester 4</option>
                                            <option>Semester 5</option>
                                            <option>Semester 6</option>

                                        </select>

                                    </div>

                                    <!-- Gender -->

                                    <div class="col-md-6 mb-4">

                                        <label class="form-label">

                                            Gender

                                        </label>

                                        <select class="form-select">

                                            <option>Select Gender</option>

                                            <option>Male</option>
                                            <option>Female</option>
                                            <option>Other</option>

                                        </select>

                                    </div>

                                    <!-- Email -->

                                    <div class="col-md-6 mb-4">

                                        <label class="form-label">

                                            Email Address

                                        </label>

                                        <input type="email"
                                            class="form-control"
                                            placeholder="Enter Email">

                                    </div>

                                    <!-- Phone -->

                                    <div class="col-md-6 mb-4">

                                        <label class="form-label">

                                            Mobile Number

                                        </label>

                                        <input type="tel"
                                            class="form-control"
                                            placeholder="Enter Mobile Number">

                                    </div>

                                    <!-- DOB -->

                                    <div class="col-md-6 mb-4">

                                        <label class="form-label">

                                            Date of Birth

                                        </label>

                                        <input type="date"
                                            class="form-control">

                                    </div>

                                    <!-- Password -->

                                    <div class="col-md-6 mb-4">

                                        <label class="form-label">

                                            Password

                                        </label>

                                        <input type="password"
                                            class="form-control"
                                            placeholder="Create Password">

                                    </div>

                                    <!-- Confirm Password -->

                                    <div class="col-md-6 mb-4">

                                        <label class="form-label">

                                            Confirm Password

                                        </label>

                                        <input type="password"
                                            class="form-control"
                                            placeholder="Confirm Password">

                                    </div>

                                    <!-- Address -->

                                    <div class="col-12 mb-4">

                                        <label class="form-label">

                                            Address

                                        </label>

                                        <textarea rows="4"
                                            class="form-control"
                                            placeholder="Enter Your Address"></textarea>

                                    </div>

                                    <!-- Terms -->

                                    <div class="col-12 mb-4">

                                        <div class="form-check">

                                            <input class="form-check-input"
                                                type="checkbox"
                                                id="terms">

                                            <label class="form-check-label"
                                                for="terms">

                                                I agree to the Terms &
                                                Conditions and Privacy Policy.

                                            </label>

                                        </div>

                                    </div>

                                    <!-- Button -->

                                    <div class="col-12">

                                        <button class="btn btn-primary btn-lg w-100">

                                            <i class="bi bi-person-check-fill"></i>

                                            Register Account

                                        </button>

                                    </div>

                                </div>

                            </form>

                            <hr>

                            <div class="text-center">

                                Already have an account?

                                <a href="login.html"
                                    class="fw-bold text-decoration-none">

                                    Login Here

                                </a>

                            </div>

                            <div class="text-center mt-3">

                                <a href="index.html"
                                    class="btn btn-link">

                                    ← Back to Home

                                </a>

                            </div>

                        </div>

                    </div>

                </div>

            </div>

        </div>

    </section>

    <!-- Bootstrap JS -->

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>

</body>

</html>
